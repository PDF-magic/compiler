name: Compiler CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: Python and JavaScript regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser configuration regression suite
        run: node tests/configuration.test.cjs
